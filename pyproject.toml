[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-task-orchestrator"
version = "2.1.0"
description = "Lightweight durable agent task orchestrator in isolated Git worktrees"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
server = ["mcp>=2.3,<2.4", "starlette>=0.48,<1", "uvicorn>=0.31.1,<1"]

[project.scripts]
ato = "ato.cli:main"

[tool.setuptools]
packages = ["ato", "ato.adapters", "ato.server"]

[tool.setuptools.package-data]
"ato.adapters" = ["acpx_bridge.mjs"]

[tool.setuptools.data-files]
"share/agent-task-orchestrator" = ["pi-path-guard.mjs"]
"share/agent-task-orchestrator/skills/ato" = ["skills/ato/SKILL.md"]
"share/agent-task-orchestrator/skills/ato/references" = ["skills/ato/references/*.md"]
"share/agent-task-orchestrator/skills/ato/templates" = ["skills/ato/templates/*.json", "skills/ato/templates/*.toml"]
