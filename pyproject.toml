[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-task-orchestrator"
version = "2.0.0"
description = "Lightweight durable agent task orchestrator in isolated Git worktrees"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = []

[project.scripts]
ato = "ato.cli:main"

[tool.setuptools]
packages = ["ato", "ato.adapters"]

[tool.setuptools.package-data]
"ato.adapters" = ["acpx_bridge.mjs"]

[tool.setuptools.data-files]
"share/agent-task-orchestrator" = ["pi-path-guard.mjs"]
"share/agent-task-orchestrator/skills/ato" = ["skills/ato/SKILL.md"]
