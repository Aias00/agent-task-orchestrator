[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-task-orchestrator"
version = "1.0.0"
description = "ATO unified task orchestration source with independent host checks"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
acp = [
  "agent-client-protocol==1.0.0",
  "annotated-types==0.8.0",
  "pydantic==2.14.3",
  "pydantic_core==2.50.4",
  "typing-inspection==0.4.5",
  "typing_extensions==4.16.0"
]

# The sealed source installer publishes the single ato launcher.
# Python package metadata does not activate a runtime.
[tool.setuptools]
packages = ["ato_cli"]
py-modules = [
  "acp_bridge",
  "acp_outcome",
  "agent_native_events",
  "agent_registry",
  "agents",
  "appserver",
  "ato",
  "ato_acceptance",
  "ato_application",
  "ato_binding",
  "ato_config",
  "ato_core",
  "ato_execution",
  "ato_execution_host",
  "ato_host",
  "ato_observer",
  "ato_watchdog",
  "ato_private",
  "ato_process",
  "ato_product",
  "ato_release_lib",
  "ato_runtime",
  "ato_seal",
  "ato_task_store",
  "budget",
  "codex_legacy",
  "codex_session_adapter",
  "completion_notifications",
  "control",
  "control_store",
  "coordination",
  "delegation",
  "execution_policy",
  "execution_state",
  "failure_attention",
  "failure_notice",
  "host_budget",
  "host_recheck",
  "hub_queue_gate",
  "hub_contract",
  "hub_sandbox",
  "hub_worktree",
  "hub_ledger",
  "hub_adapter_agy",
  "hub_adapter_claude",
  "hub_adapter_codex",
  "hub_registry",
  "hub_loop",
  "interaction",
  "local_session_adapter",
  "message_bus",
  "notification_state",
  "notifications",
  "permissions",
  "pi_acp_compat",
  "pi_acp_exec",
  "pi_acp_worker",
  "pi_coordinator_exec",
  "pi_production_credentials",
  "pi_production_fence",
  "pi_production_profile",
  "pi_production_egress",
  "pi_production_exec",
  "pi_session_coordinator",
  "pi_session_profile",
  "pi_toolchain",
  "progress",
  "recovery",
  "runner",
  "session_router",
  "task_trace",
  "transport",
  "workflow",
  "workflow_closure",
  "workflow_lineage"
]

[tool.setuptools.data-files]
"share/agent-task-orchestrator" = ["pi-path-guard.mjs", "pi-coordinator-guard.mjs", "pi_production_transport.mjs"]

"share/agent-task-orchestrator/bin" = ["bin/ato"]

"share/agent-task-orchestrator/integrations/pi-acp" = [
  "integrations/pi-acp/compatibility.json",
  "integrations/pi-acp/package.json",
  "integrations/pi-acp/package-lock.json"
]

"share/agent-task-orchestrator/scripts" = ["scripts/install.py", "scripts/release_snapshot.py", "scripts/ato_host_setup.py"]

"share/agent-task-orchestrator/skills/ato" = ["skills/ato/SKILL.md"]
