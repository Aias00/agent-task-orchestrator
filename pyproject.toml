[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-task-orchestrator"
version = "2.0.0"
description = "Lightweight durable agent task orchestrator in isolated Git worktrees"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
acp = [
  "agent-client-protocol==1.0.0",
  "annotated-types==0.8.0",
  "pydantic==2.14.3",
  "pydantic_core==2.50.4",
  "typing-inspection==0.4.5",
  "typing_extensions==4.16.0",
]

[project.scripts]
ato = "ato.cli:main"

[tool.setuptools]
packages = ["ato", "ato.adapters"]

[tool.setuptools.data-files]
"share/agent-task-orchestrator" = ["pi-path-guard.mjs", "pi-coordinator-guard.mjs"]
"share/agent-task-orchestrator/integrations/pi-acp" = [
  "integrations/pi-acp/compatibility.json",
  "integrations/pi-acp/package.json",
  "integrations/pi-acp/package-lock.json",
]
"share/agent-task-orchestrator/skills/ato" = ["skills/ato/SKILL.md"]
